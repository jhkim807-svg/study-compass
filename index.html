<title>학습 나침반</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

  :root{
    --bg:#F3F4F9;
    --surface:#FFFFFF;
    --surface-soft:#EBEEF6;
    --ink:#1B2233;
    --ink-soft:#5A6178;
    --line:#DDE0EA;
    --grid-line:rgba(27,34,51,0.055);
    --accent:#33477A;
    --accent-ink:#FFFFFF;
    --visual:#3B6EA5;
    --auditory:#6C5CA6;
    --kinesthetic:#3F8361;
    --shadow:rgba(27,34,51,0.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12141C;
      --surface:#1B1E2A;
      --surface-soft:#242739;
      --ink:#ECEEF6;
      --ink-soft:#A7ADC2;
      --line:#333850;
      --grid-line:rgba(255,255,255,0.05);
      --accent:#8398DA;
      --accent-ink:#12141C;
      --visual:#79A6DE;
      --auditory:#AC9BDE;
      --kinesthetic:#79C79B;
      --shadow:rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12141C;
    --surface:#1B1E2A;
    --surface-soft:#242739;
    --ink:#ECEEF6;
    --ink-soft:#A7ADC2;
    --line:#333850;
    --grid-line:rgba(255,255,255,0.05);
    --accent:#8398DA;
    --accent-ink:#12141C;
    --visual:#79A6DE;
    --auditory:#AC9BDE;
    --kinesthetic:#79C79B;
    --shadow:rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  h1,h2,p,button{margin:0;}
  body{
    background:var(--bg);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:26px 26px;
    color:var(--ink);
    font-family:'Noto Sans KR', system-ui, -apple-system, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  button{font-family:inherit;}

  .stage{width:100%;max-width:440px;}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:0 18px 40px -20px var(--shadow);
    padding:28px 26px 30px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .masthead{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .masthead .mark{
    width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    border-radius:9px;
    background:var(--accent);
    color:var(--accent-ink);
    font-size:15px;
  }
  .masthead-text{
    font-size:0.82rem;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--ink-soft);
  }

  .screen{display:flex;flex-direction:column;gap:18px;}
  .screen[hidden]{display:none;}

  .eyebrow{
    font-size:0.78rem;
    font-weight:600;
    color:var(--ink-soft);
    letter-spacing:0.04em;
    font-variant-numeric:tabular-nums;
  }

  h1{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:clamp(1.5rem, 5vw, 1.85rem);
    line-height:1.35;
    text-wrap:balance;
  }

  .lead{
    font-size:0.94rem;
    line-height:1.7;
    color:var(--ink-soft);
  }

  .btn-primary, .btn-secondary{
    border:none;
    border-radius:13px;
    padding:15px 18px;
    font-size:0.98rem;
    font-weight:700;
    cursor:pointer;
    transition:transform 120ms ease, opacity 120ms ease;
  }
  .btn-primary{
    background:var(--accent);
    color:var(--accent-ink);
  }
  .btn-secondary{
    background:var(--surface-soft);
    color:var(--ink);
    border:1px solid var(--line);
  }
  .btn-primary:hover, .btn-secondary:hover{opacity:0.88;}
  .btn-primary:active, .btn-secondary:active{transform:scale(0.98);}
  .btn-primary:focus-visible, .btn-secondary:focus-visible,
  .option:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  .progress-row{display:flex;flex-direction:column;gap:8px;}
  .progress-label{
    font-size:0.78rem;
    font-weight:600;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    letter-spacing:0.03em;
  }
  .progress-track{
    height:6px;
    border-radius:99px;
    background:var(--surface-soft);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:12.5%;
    background:var(--accent);
    border-radius:99px;
    transition:width 320ms ease;
  }

  .question{
    font-family:'Noto Serif KR', serif;
    font-weight:600;
    font-size:clamp(1.1rem, 4.4vw, 1.3rem);
    line-height:1.5;
    text-wrap:balance;
  }

  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    text-align:left;
    background:var(--surface-soft);
    border:1px solid var(--line);
    border-radius:13px;
    padding:14px 16px;
    font-size:0.93rem;
    line-height:1.55;
    color:var(--ink);
    cursor:pointer;
    transition:border-color 120ms ease, background 120ms ease, transform 120ms ease;
  }
  .option:hover{border-color:var(--accent);}
  .option:active{transform:scale(0.99);}
  .option.chosen{
    border-color:var(--accent);
    background:var(--surface);
  }

  .result-icon{
    width:56px;height:56px;
    border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    background:var(--result-tint, var(--surface-soft));
    color:var(--result-color, var(--accent));
  }
  .result-icon svg{width:30px;height:30px;}

  .result-name{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:clamp(1.55rem, 6vw, 1.9rem);
    color:var(--result-color, var(--accent));
    text-wrap:balance;
  }

  .result-desc{
    font-size:0.95rem;
    line-height:1.75;
    color:var(--ink-soft);
  }

  .tips{display:flex;flex-direction:column;gap:10px;}
  .tip{
    display:flex;
    gap:12px;
    background:var(--surface-soft);
    border:1px solid var(--line);
    border-radius:13px;
    padding:13px 15px;
  }
  .tip-num{
    flex:none;
    width:24px;height:24px;
    border-radius:8px;
    background:var(--result-color, var(--accent));
    color:var(--surface);
    font-size:0.78rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums;
  }
  .tip-text{font-size:0.9rem;line-height:1.6;color:var(--ink);}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>

<div class="stage">
  <div class="card">
    <header class="masthead">
      <span class="mark">🧭</span>
      <span class="masthead-text">학습 나침반 · 학습 성향 진단</span>
    </header>

    <section class="screen" id="screen-intro">
      <p class="eyebrow">8문항 · 약 2분</p>
      <h1>나는 어떻게 배울 때<br>가장 잘 이해될까?</h1>
      <p class="lead">그림으로 볼 때, 설명을 들을 때, 직접 해볼 때 — 사람마다 가장 잘 통하는 학습 방식이 달라요. 8개 질문에 답하고 나에게 맞는 학습 유형과 공부 팁을 확인해보세요.</p>
      <button class="btn-primary" id="start-btn">시작하기</button>
    </section>

    <section class="screen" id="screen-quiz" hidden>
      <div class="progress-row">
        <span class="progress-label" id="progress-label">Q1 · 8</span>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <h2 class="question" id="question-text"></h2>
      <div class="options" id="options-list"></div>
    </section>

    <section class="screen" id="screen-result" hidden>
      <div class="result-icon" id="result-icon"></div>
      <p class="eyebrow">당신의 학습 유형은</p>
      <h1 class="result-name" id="result-name"></h1>
      <p class="result-desc" id="result-desc"></p>
      <div class="tips" id="tips-list"></div>
      <button class="btn-secondary" id="restart-btn">다시 하기</button>
    </section>
  </div>
</div>

<script>
(function(){
  var questions = [
    { text:"새로운 내용을 배울 때 나는?", options:[
      {label:"그림·도표가 있으면 이해가 빠르다", type:"visual"},
      {label:"설명을 들으면 잘 외워진다", type:"auditory"},
      {label:"직접 해봐야 확실히 안다", type:"kinesthetic"}]},
    { text:"수업 필기를 할 때 나는?", options:[
      {label:"색펜과 형광펜으로 눈에 띄게 정리한다", type:"visual"},
      {label:"선생님 말씀을 되뇌며 받아 적는다", type:"auditory"},
      {label:"필기보다 예제를 직접 풀어보며 이해한다", type:"kinesthetic"}]},
    { text:"시험 전날 벼락치기를 한다면?", options:[
      {label:"요약노트나 마인드맵을 보며 복습한다", type:"visual"},
      {label:"친구와 서로 설명해주며 복습한다", type:"auditory"},
      {label:"문제를 최대한 많이 풀어본다", type:"kinesthetic"}]},
    { text:"낯선 장소로 길을 찾아갈 때 나는?", options:[
      {label:"지도를 보며 경로를 확인한다", type:"visual"},
      {label:"주변 사람에게 길을 물어본다", type:"auditory"},
      {label:"일단 걸어가면서 감으로 찾는다", type:"kinesthetic"}]},
    { text:"새로운 앱이나 프로그램 사용법을 익힐 때?", options:[
      {label:"튜토리얼 화면과 스크린샷을 꼼꼼히 본다", type:"visual"},
      {label:"설명 영상이나 누군가의 설명을 듣는다", type:"auditory"},
      {label:"일단 눌러보면서 몸으로 배운다", type:"kinesthetic"}]},
    { text:"조별 발표를 준비할 때 나는?", options:[
      {label:"슬라이드와 이미지 자료부터 만든다", type:"visual"},
      {label:"발표 내용을 소리 내어 여러 번 말해본다", type:"auditory"},
      {label:"실제로 서서 발표 리허설을 해본다", type:"kinesthetic"}]},
    { text:"오래 기억에 남는 수업을 떠올리면?", options:[
      {label:"그래프·사진·영상 자료가 많았던 수업", type:"visual"},
      {label:"선생님의 설명이 재미있었던 수업", type:"auditory"},
      {label:"실험이나 활동을 직접 했던 수업", type:"kinesthetic"}]},
    { text:"공부하다 집중이 흐트러졌을 때 나는?", options:[
      {label:"자료를 색깔별로 다시 보기 좋게 정리한다", type:"visual"},
      {label:"음악을 듣거나 누군가와 대화하며 환기한다", type:"auditory"},
      {label:"자리에서 일어나 몸을 움직인다", type:"kinesthetic"}]}
  ];

  var icons = {
    visual:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 24C4 24 13 11 24 11C35 11 44 24 44 24C44 24 35 37 24 37C13 37 4 24 4 24Z"/><circle cx="24" cy="24" r="7"/></svg>',
    auditory:'<svg viewBox="0 0 48 48" fill="currentColor"><rect x="5" y="19" width="6" height="10" rx="3"/><rect x="16" y="10" width="6" height="28" rx="3"/><rect x="27" y="4" width="6" height="40" rx="3"/><rect x="38" y="14" width="6" height="20" rx="3"/></svg>',
    kinesthetic:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3"><circle cx="24" cy="24" r="6" fill="currentColor" stroke="none"/><circle cx="24" cy="24" r="14" opacity="0.55"/><circle cx="24" cy="24" r="21" opacity="0.28"/></svg>'
  };

  var results = {
    visual:{
      name:"시각형 학습자",
      color:"var(--visual)",
      desc:"당신은 눈으로 보고 정리할 때 학습 효과가 가장 좋은 시각형 학습자예요. 글로만 된 설명보다 그림, 도표, 색깔로 정리된 정보를 더 빠르고 오래 기억합니다.",
      tips:[
        "교과서 내용을 마인드맵이나 표로 다시 그려서 정리해 보세요.",
        "중요한 부분은 색깔별로 형광펜을 구분해서 한눈에 들어오게 만드세요.",
        "글로만 된 개념은 직접 그래프나 그림으로 바꿔서 이해해 보세요."
      ]
    },
    auditory:{
      name:"청각형 학습자",
      color:"var(--auditory)",
      desc:"당신은 듣고 말하면서 이해할 때 학습 효과가 가장 좋은 청각형 학습자예요. 설명을 듣거나 소리 내어 말할 때 내용이 훨씬 잘 정리됩니다.",
      tips:[
        "공부한 내용을 친구나 가족에게 설명하듯 소리 내어 말해 보세요.",
        "인강이나 강의 영상으로 개념을 먼저 들은 후 문제를 풀어보세요.",
        "암기할 내용에 리듬을 붙이거나 노래처럼 만들어 외워 보세요."
      ]
    },
    kinesthetic:{
      name:"체험형 학습자",
      color:"var(--kinesthetic)",
      desc:"당신은 직접 해보고 몸으로 부딪히며 이해할 때 학습 효과가 가장 좋은 체험형 학습자예요. 이론 설명보다 실습과 문제풀이를 통해 더 확실하게 배웁니다.",
      tips:[
        "개념을 배운 직후 바로 관련 문제를 풀며 몸에 익혀 보세요.",
        "가만히 읽기보다 걸으며 암기하거나 손으로 써보며 공부해 보세요.",
        "실험, 실습, 모형 만들기처럼 직접 참여하는 활동으로 개념을 확인하세요."
      ]
    }
  };

  var current = 0;
  var answers = [];

  var screenIntro = document.getElementById('screen-intro');
  var screenQuiz = document.getElementById('screen-quiz');
  var screenResult = document.getElementById('screen-result');
  var progressLabel = document.getElementById('progress-label');
  var progressFill = document.getElementById('progress-fill');
  var questionText = document.getElementById('question-text');
  var optionsList = document.getElementById('options-list');

  document.getElementById('start-btn').addEventListener('click', function(){
    screenIntro.hidden = true;
    screenQuiz.hidden = false;
    renderQuestion();
  });

  document.getElementById('restart-btn').addEventListener('click', function(){
    current = 0;
    answers = [];
    screenResult.hidden = true;
    screenIntro.hidden = false;
  });

  function renderQuestion(){
    var q = questions[current];
    progressLabel.textContent = 'Q' + (current + 1) + ' · ' + questions.length;
    progressFill.style.width = (((current) / questions.length) * 100 + (100 / questions.length)) + '%';
    questionText.textContent = q.text;
    optionsList.innerHTML = '';
    q.options.forEach(function(opt){
      var btn = document.createElement('button');
      btn.className = 'option';
      btn.type = 'button';
      btn.textContent = opt.label;
      btn.addEventListener('click', function(){ selectOption(opt.type); });
      optionsList.appendChild(btn);
    });
  }

  function selectOption(type){
    answers.push(type);
    current++;
    if (current < questions.length){
      renderQuestion();
    } else {
      showResult();
    }
  }

  function computeType(){
    var counts = { visual:0, auditory:0, kinesthetic:0 };
    var firstIndex = {};
    answers.forEach(function(t, i){
      counts[t]++;
      if (!(t in firstIndex)) firstIndex[t] = i;
    });
    var best = null;
    Object.keys(counts).forEach(function(t){
      if (best === null) { best = t; return; }
      if (counts[t] > counts[best]) best = t;
      else if (counts[t] === counts[best] && firstIndex[t] < firstIndex[best]) best = t;
    });
    return best;
  }

  function showResult(){
    var type = computeType();
    var r = results[type];
    document.getElementById('result-name').textContent = r.name;
    document.getElementById('result-desc').textContent = r.desc;
    document.getElementById('result-icon').innerHTML = icons[type];
    document.getElementById('result-icon').style.setProperty('--result-color', r.color);
    document.getElementById('result-name').style.setProperty('--result-color', r.color);

    var tipsList = document.getElementById('tips-list');
    tipsList.innerHTML = '';
    r.tips.forEach(function(tip, i){
      var row = document.createElement('div');
      row.className = 'tip';
      var num = document.createElement('span');
      num.className = 'tip-num';
      num.style.setProperty('--result-color', r.color);
      num.textContent = i + 1;
      var text = document.createElement('span');
      text.className = 'tip-text';
      text.textContent = tip;
      row.appendChild(num);
      row.appendChild(text);
      tipsList.appendChild(row);
    });

    screenQuiz.hidden = true;
    screenResult.hidden = false;
  }
})();
</script>
